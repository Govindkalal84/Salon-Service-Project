server:
  port: 5007

spring:
  application:
    name: notification-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/salon?sslMode=VERIFY_IDENTITY}
    username: ${SPRING_DATASOURCE_USERNAME:yq9eAkzxxvnYuz5.root}
    password: ${SPRING_DATASOURCE_PASSWORD:ER5KAuU7ycb51i90}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:frog.lmq.cloudamqp.com}
    port: ${SPRING_RABBITMQ_PORT:5671}
    username: ${SPRING_RABBITMQ_USERNAME:lvefmwnj}
    password: ${SPRING_RABBITMQ_PASSWORD:8EEJU4SYUV69SERKgCFdSEMB58ABPBXX}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:lvefmwnj}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:true}
    listener:
      simple:
        missing-queues-fatal: false
        auto-startup: true
        retry:
          enabled: true
          initial-interval: 3000ms
          max-attempts: 3
          max-interval: 10000ms

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:https://eureka-4.onrender.com/eureka/}
