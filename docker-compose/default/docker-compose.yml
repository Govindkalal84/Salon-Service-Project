version: "3.8"

services:

  mysqldb:
    image: mysql:8
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  eurekaserver:
    image: govindkalal/salon-eurekaserver-yt:v1
    container_name: eurekaserver
    ports:
      - "8070:8070"
    restart: always

  gatewayserver:
    image: govindkalal/salon-gatewayserver-yt:v1
    container_name: gatewayserver
    ports:
      - "5000:5000"
    environment:
      SPRING_APPLICATION_NAME: gateway-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      SPRING_CLOUD_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eurekaserver
    restart: always

  user:
    image: govindkalal/salon-user-yt:v1
    container_name: user
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/user_yt?createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    restart: always

  booking:
    image: govindkalal/salon-booking-yt:v1
    container_name: booking
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/booking_yt?createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
      # CloudAMQP / LavinMQ configuration
      SPRING_RABBITMQ_HOST: frog.lmq.cloudamqp.com
      SPRING_RABBITMQ_PORT: "5671"
      SPRING_RABBITMQ_USERNAME: lvefmwnj
      SPRING_RABBITMQ_PASSWORD: 8EEJU4SYUV69SERKgCFdSEMB58ABPBXX
      SPRING_RABBITMQ_VIRTUAL_HOST: lvefmwnj
      SPRING_RABBITMQ_SSL_ENABLED: "true"
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    restart: always

  category:
    image: govindkalal/salon-category-yt:v1
    container_name: category
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/category_yt?createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    restart: always

  payment:
    image: govindkalal/salon-payment-yt:v1
    container_name: payment
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/payment_yt?createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    restart: always

  salon:
    image: govindkalal/salon-yt:v1
    container_name: salon
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/salon_yt?createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    depends_on:
      mysqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    restart: always

  service-offering:
    image: govindkalal/salon-service-offering-yt:v1
    container_name: service-offering
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/service_yt?createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8070/eureka/
    depends_on:
